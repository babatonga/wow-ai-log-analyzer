name: wow-ai-log-analyzer

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  backend:
    # `image:` first, then `build:` — when CI publishes the image to ghcr
    # users can pull it as-is; locally `docker compose up --build` still
    # rebuilds and tags as ``image:`` so worker can ``image:`` reference
    # the same artifact.
    image: ${BACKEND_IMAGE:-wow-ai-log-analyzer-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ┌─────────────────────────────────────────────────────────────┐
    # │ OPTIONAL: Docker-socket mount for the admin "System" card.  │
    # │ Powers ADMIN_DOCKER_CONTROL=true so admins can start/stop/  │
    # │ restart the compose stack from the UI and the local-ai     │
    # │ container is auto-toggled with the AI-provider drop-down.   │
    # │                                                             │
    # │ SECURITY: this mount is equivalent to root on the host.     │
    # │ ANY code-execution bug in the backend gives an attacker     │
    # │ root over the entire machine. If you don't need the feature │
    # │ — set ADMIN_DOCKER_CONTROL=false in .env AND comment the    │
    # │ two lines below out for full belt-and-braces.               │
    # └─────────────────────────────────────────────────────────────┘
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Bind only to loopback so the reverse proxy on the host (Caddy/nginx)
      # can reach it but nothing on the public internet can.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health'); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    # Reuse the backend image (same code, different command). Avoids a
    # second build job in CI and a duplicate ~250 MB layer set on disk.
    image: ${BACKEND_IMAGE:-wow-ai-log-analyzer-backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    command: ["uv", "run", "arq", "app.workers.arq_app.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    # The image is fully deployment-agnostic since the runtime-config
    # refactor — imprint, default locale, Turnstile site key etc. are
    # read at request time via process.env (server components) or the
    # public /api/v1/config endpoint (client). Pull from ghcr or build
    # locally; same artifact runs on any host.
    image: ${FRONTEND_IMAGE:-wow-ai-log-analyzer-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Internal target for the Next.js /api/:path* route handler. Used
      # when there's no reverse proxy in front (e.g. hitting
      # localhost:3000 directly). With a proxy in front, /api/* is
      # intercepted before reaching this container and this var is
      # unused.
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  # Optional: locally hosted OpenAI-compatible LLM server (llama.cpp). Only
  # starts when explicitly requested:
  #   docker compose --profile local-ai up -d
  # Requires NVIDIA Container Toolkit + driver on the host.
  #
  # We use llama.cpp's official upstream server-cuda image (Ollama lags
  # behind on bleeding-edge model architectures, e.g. qwen35moe) and wrap
  # it with a small Python supervisor so the backend can switch models,
  # delete cached GGUFs and stop inference WITHOUT needing Docker socket
  # access. The supervisor persists its config in /cache so admin changes
  # survive container restarts.
  local-ai:
    profiles: ["local-ai"]
    # Pull the published image from ghcr by default; override
    # LOCAL_AI_IMAGE in .env to pin a specific release. Compose
    # falls back to building locally if the image tag isn't found.
    image: ${LOCAL_AI_IMAGE:-wow-ai-log-analyzer-local-ai:latest}
    build:
      context: ./local-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HUGGINGFACE_TOKEN:-}
      LLAMA_CACHE: /cache
      # Initial defaults — the supervisor seeds its persisted state from
      # these on first boot. Once an admin saves config in the UI the
      # /cache/supervisor-state.json file overrides them on subsequent
      # boots.
      LOCAL_AI_HF_REPO: ${LOCAL_AI_HF_REPO:-}
      LOCAL_AI_HF_FILE: ${LOCAL_AI_HF_FILE:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-local-llm}
      LOCAL_AI_CTX_SIZE: ${LOCAL_AI_CTX_SIZE:-16384}
      LOCAL_AI_ENABLE_THINKING: ${LOCAL_AI_ENABLE_THINKING:-true}
      # The :server-cuda image ships the CUDA backend at /app/libggml-cuda.so
      # but doesn't set LD_LIBRARY_PATH for it, so the runtime dlopen falls
      # back to "no usable GPU found". Make the dependent libs reachable:
      LD_LIBRARY_PATH: /app:/usr/local/cuda/lib64
    volumes:
      - llama-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    expose:
      - "8080"  # llama-server inference (managed by supervisor)
      - "8081"  # supervisor management API
    healthcheck:
      # The supervisor responds on :8081 even while the model is still
      # downloading or the child is stopped — that's the right liveness
      # signal here. /v1/models on :8080 only goes 200 once a model is
      # loaded into VRAM, which can be 10-40 min after first boot, so
      # we'd otherwise see the container stuck "unhealthy" for the
      # whole load. The LocalAiCard shows actual inference readiness.
      #
      # Note: must use curl rather than the bash /dev/tcp/ idiom because
      # the upstream image's /bin/sh is dash, which doesn't support it.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # SimulationCraft sidecar. Wraps the upstream simulationcraftorg/simc
  # image with a tiny FastAPI server that exposes /simulate, /version
  # and /healthz on :8090. The backend worker hits this on the compose
  # network — no Docker socket access needed for runs themselves.
  #
  # Part of the default stack (no compose profile) so /simulate works
  # out of the box. Admins can bump to the latest upstream simc daily
  # (DBC data + binary) from the admin UI via ADMIN_DOCKER_CONTROL →
  # docker-socket mount on the backend container.
  simc:
    # Image name matches the CI publish target on ghcr.io
    # (``wow-ai-log-analyzer-simc``). The historical
    # ``SIMC_SIDECAR_IMAGE`` env var still works as an override.
    image: ${SIMC_SIDECAR_IMAGE:-wow-ai-log-analyzer-simc:latest}
    build:
      context: ./simc-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Cap on simc's thread pool per request. 0 = simc decides (one
      # per logical CPU). Conservative 4 leaves plenty of cores free
      # for the rest of the stack; bump if sims feel slow.
      SIMC_DEFAULT_THREADS: ${SIMC_DEFAULT_THREADS:-4}
      SIMC_TIMEOUT_S: ${SIMC_TIMEOUT_S:-1800}
      # Failed simc runs save the exact input.simc + args + log to
      # this directory so we can pull them out via the named volume
      # and bisect down to whatever item / item-thread interaction
      # simc tripped over. Bounded by simple disk eviction (manual rm).
      SIMC_CRASH_DUMP_DIR: /crashes
    volumes:
      - simc-crash-dumps:/crashes
    expose:
      - "8090"
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8090/healthz'); sys.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  llama-cache:
  simc-crash-dumps:
